services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./tests.sql:/tests.sql:ro
      - datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
  producer:
    build: .
    command: /app/.venv/bin/python /app/app_simulator/producer.py
    restart: on-failure
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-streams}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-2}
      SKIP_RATE: ${SKIP_RATE:-0.2}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0.2}
      MAX_DUPLICATE_DELAY_SECONDS: ${MAX_DUPLICATE_DELAY_SECONDS:-300}
      MAX_PLAY_AGE_DAYS: ${MAX_PLAY_AGE_DAYS:-14}
    volumes: ["logs:/app/logs", "crudo:/app/data/raw"]
  consumer:
    build: .
    command: /app/.venv/bin/python /app/ingestion/consumer.py
    restart: on-failure
    depends_on: [kafka]
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-streams}
    volumes: ["logs:/app/logs", "crudo:/app/data/raw"]
  processor:
    build: .
    command: ["sh", "-c", "printenv | grep -E '^(POSTGRES|KAFKA)_' > /etc/environment && cron -f"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-streams}
    volumes: ["logs:/app/logs", "crudo:/app/data/raw"]
volumes:
  datos:
  crudo:
  logs:
